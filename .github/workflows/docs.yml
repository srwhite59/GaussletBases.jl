name: Docs

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [release-0.2.0]
      expected_sha:
        description: Exact reviewed documentation commit (40 lowercase hex characters)
        type: string
        required: true

jobs:
  cartesian-authority:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Check Cartesian authority
        run: |
          julia --startup-file=no --project=docs docs/check_cartesian_authority.jl --check
          julia --startup-file=no --project=docs docs/check_cartesian_authority.jl --self-test

  docs:
    if: github.event_name == 'pull_request'
    needs: cartesian-authority
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'

      - name: Build docs
        run: julia --project=docs docs/make.jl

  docs-deploy:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
    needs: cartesian-authority
    concurrency:
      group: documentation-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'

      - name: Build and deploy docs
        env:
          GAUSSLETBASES_DOCS_DEPLOY: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAUSSLETBASES_DOCS_REFRESH: ${{ inputs.mode }}
          GAUSSLETBASES_DOCS_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: julia --project=docs docs/make.jl
